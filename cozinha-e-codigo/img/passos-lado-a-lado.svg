<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520">
    <title>Passos da receita e passos do algoritmo lado a lado</title>

    <!-- Fundo -->
    <rect width="960" height="520" rx="16" fill="#0b1633"/>
    <rect x="1" y="1" width="958" height="518" rx="16" fill="none" stroke="#1f3d73" stroke-width="2"/>

    <text x="480" y="56" text-anchor="middle" font-family="Segoe UI, Tahoma, Arial, sans-serif"
          font-size="14" font-weight="bold" letter-spacing="4" fill="#7fa6e8">MESMA ESTRUTURA, DOMÍNIOS DIFERENTES</text>

    <!-- ============ Cartao da esquerda: receita ============ -->
    <rect x="44" y="86" width="400" height="372" rx="14" fill="#16305f" stroke="#1f3d73" stroke-width="2"/>
    <rect x="44" y="86" width="400" height="52" rx="14" fill="#c8102e"/>
    <rect x="44" y="116" width="400" height="22" fill="#c8102e"/>
    <text x="72" y="119" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="16"
          font-weight="bold" letter-spacing="1.5" fill="#ffffff">BOLO DE CHOCOLATE</text>

    <!-- Linha que liga os passos -->
    <line x1="88" y1="190" x2="88" y2="422" stroke="#2a4a85" stroke-width="3"/>

    <g font-family="Segoe UI, Tahoma, Arial, sans-serif">
        <circle cx="88" cy="190" r="19" fill="#c8102e"/>
        <text x="88" y="196" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">1</text>
        <text x="122" y="196" font-size="17" fill="#e6ecf5">Separar ingredientes</text>

        <circle cx="88" cy="248" r="19" fill="#c8102e"/>
        <text x="88" y="254" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">2</text>
        <text x="122" y="254" font-size="17" fill="#e6ecf5">Misturar secos e úmidos</text>

        <circle cx="88" cy="306" r="19" fill="#c8102e"/>
        <text x="88" y="312" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">3</text>
        <text x="122" y="312" font-size="17" fill="#e6ecf5">Despejar na forma</text>

        <circle cx="88" cy="364" r="19" fill="#c8102e"/>
        <text x="88" y="370" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">4</text>
        <text x="122" y="370" font-size="17" fill="#e6ecf5">Assar 180 °C / 40 min</text>

        <circle cx="88" cy="422" r="19" fill="#c8102e"/>
        <text x="88" y="428" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">5</text>
        <text x="122" y="428" font-size="17" fill="#e6ecf5">Esperar esfriar</text>
    </g>

    <!-- ============ Cartao da direita: algoritmo ============ -->
    <rect x="516" y="86" width="400" height="372" rx="14" fill="#16305f" stroke="#1f3d73" stroke-width="2"/>
    <rect x="516" y="86" width="400" height="52" rx="14" fill="#2b5aa8"/>
    <rect x="516" y="116" width="400" height="22" fill="#2b5aa8"/>
    <text x="544" y="119" font-family="Segoe UI, Tahoma, Arial, sans-serif" font-size="16"
          font-weight="bold" letter-spacing="1.5" fill="#ffffff">ORDENAR UMA LISTA</text>

    <line x1="560" y1="190" x2="560" y2="422" stroke="#2a4a85" stroke-width="3"/>

    <g font-family="Segoe UI, Tahoma, Arial, sans-serif">
        <circle cx="560" cy="190" r="19" fill="#2b5aa8"/>
        <text x="560" y="196" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">1</text>
        <text x="594" y="196" font-size="17" fill="#e6ecf5">Receber a lista</text>

        <circle cx="560" cy="248" r="19" fill="#2b5aa8"/>
        <text x="560" y="254" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">2</text>
        <text x="594" y="254" font-size="17" fill="#e6ecf5">Comparar vizinhos</text>

        <circle cx="560" cy="306" r="19" fill="#2b5aa8"/>
        <text x="560" y="312" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">3</text>
        <text x="594" y="312" font-size="17" fill="#e6ecf5">Trocar se fora de ordem</text>

        <circle cx="560" cy="364" r="19" fill="#2b5aa8"/>
        <text x="560" y="370" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">4</text>
        <text x="594" y="370" font-size="17" fill="#e6ecf5">Repetir até não haver troca</text>

        <circle cx="560" cy="422" r="19" fill="#2b5aa8"/>
        <text x="560" y="428" text-anchor="middle" font-size="16" font-weight="bold" fill="#ffffff">5</text>
        <text x="594" y="428" font-size="17" fill="#e6ecf5">Retornar a lista ordenada</text>
    </g>

    <!-- ============ Simbolo central ============ -->
    <circle cx="480" cy="272" r="26" fill="#060d20"/>
    <text x="480" y="283" text-anchor="middle" font-family="Segoe UI, Tahoma, Arial, sans-serif"
          font-size="26" font-weight="bold" fill="#ff5a5a">≈</text>

    <text x="480" y="494" text-anchor="middle" font-family="Segoe UI, Tahoma, Arial, sans-serif"
          font-size="15" font-style="italic" fill="#95a3ba">Cada passo depende do anterior ter dado certo.</text>
</svg>
